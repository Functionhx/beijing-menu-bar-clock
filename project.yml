name: BeijingClock
options:
  bundleIdPrefix: com.chen
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  BeijingClock:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: Beijing Clock
        EXECUTABLE_NAME: BeijingClock
        PRODUCT_BUNDLE_IDENTIFIER: com.chen.dualtime
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
