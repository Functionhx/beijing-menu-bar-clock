<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="北京时间 Beijing Menu Bar Clock">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7ED"/><stop offset="1" stop-color="#FFE4E6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FB7185" stop-opacity="0.55"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-40%" width="120%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(15,23,42,0.10)"/>
    </filter>
    <clipPath id="card"><rect width="1280" height="440" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <circle cx="1010" cy="40" r="260" fill="url(#glow)"/>
    <circle cx="140" cy="470" r="220" fill="url(#glow)" opacity="0.5"/>

    <!-- mock macOS menu bar -->
    <rect x="0" y="0" width="1280" height="56" fill="rgba(255,255,255,0.72)"/>
    <rect x="0" y="56" width="1280" height="1" fill="rgba(15,23,42,0.08)"/>
    <g fill="#334155" opacity="0.55">
      <circle cx="40" cy="28" r="9"/>
      <rect x="70" y="20" width="64" height="16" rx="8"/>
      <rect x="150" y="20" width="44" height="16" rx="8"/>
      <rect x="210" y="20" width="56" height="16" rx="8"/>
      <rect x="690" y="18" width="20" height="20" rx="6"/>
      <rect x="730" y="18" width="20" height="20" rx="10"/>
      <path d="M772 32 q12 -14 24 0 M777 36 q7 -7 14 0" stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="818" y="20" width="34" height="16" rx="5"/>
      <rect x="1216" y="18" width="36" height="20" rx="10"/>
    </g>
    <g filter="url(#shadow)">
      <rect x="872" y="10" width="324" height="36" rx="10" fill="#E11D48"/>
    </g>
    <text x="1034" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#FFFFFF">9月24日 周四 <tspan font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace">20:08:36</tspan></text>
    <path d="M1034 66 l-9 12 h18 z" fill="#E11D48"/>

    <!-- headline -->
    <text x="80" y="200" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="84" font-weight="800" fill="#0F172A" letter-spacing="2">北京时间</text>
    <text x="84" y="252" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="30" font-weight="600" fill="#E11D48">Beijing Menu Bar Clock for macOS</text>
    <text x="84" y="306" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="26" fill="#475569">不改系统时区，菜单栏常驻北京时间 · 指定 App 按指定时区打开</text>
    <text x="84" y="344" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="22" fill="#475569" opacity="0.85">Beijing time in your menu bar — without touching the system time zone.</text>

    <!-- tags -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="19" font-weight="600">
      <rect x="84" y="372" width="148" height="38" rx="19" fill="rgba(225,29,72,0.10)"/>
      <text x="158" y="398" text-anchor="middle" fill="#BE123C">原生 Swift</text>
      <rect x="246" y="372" width="148" height="38" rx="19" fill="rgba(225,29,72,0.10)"/>
      <text x="320" y="398" text-anchor="middle" fill="#BE123C">低功耗 · &lt;1 mW</text>
      <rect x="408" y="372" width="148" height="38" rx="19" fill="rgba(225,29,72,0.10)"/>
      <text x="482" y="398" text-anchor="middle" fill="#BE123C">不联网</text>
      <rect x="570" y="372" width="148" height="38" rx="19" fill="rgba(225,29,72,0.10)"/>
      <text x="644" y="398" text-anchor="middle" fill="#BE123C">整点报时</text>
    </g>

    <!-- big clock face -->
    <g transform="translate(1040 270)" opacity="0.95">
      <circle r="118" fill="none" stroke="#E11D48" stroke-opacity="0.25" stroke-width="14"/>
      <circle r="96" fill="rgba(255,255,255,0.72)" stroke="rgba(15,23,42,0.08)" stroke-width="2"/>
      <g stroke="#0F172A" stroke-linecap="round">
        <line x1="0" y1="-80" x2="0" y2="-68" stroke-width="5"/>
        <line x1="80" y1="0" x2="68" y2="0" stroke-width="5"/>
        <line x1="0" y1="80" x2="0" y2="68" stroke-width="5"/>
        <line x1="-80" y1="0" x2="-68" y2="0" stroke-width="5"/>
        <line x1="0" y1="0" x2="-43" y2="21" stroke-width="8"/>
        <line x1="0" y1="0" x2="52" y2="-47" stroke-width="5"/>
      </g>
      <line x1="8" y1="-11" x2="-45" y2="61" stroke="#E11D48" stroke-width="3" stroke-linecap="round"/>
      <circle r="7" fill="#E11D48"/>
    </g>
  </g>
</svg>
